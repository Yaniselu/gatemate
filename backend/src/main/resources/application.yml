# Secrets are read from environment variables only. Nothing sensitive is committed.
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      tracking-modes: []

spring:
  application:
    name: gatemate
  main:
    # Beans are created on first use: much faster cold starts on small instances.
    lazy-initialization: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gatemate}
    username: ${DATABASE_USER:gatemate}
    password: ${DATABASE_PASSWORD:gatemate}
    hikari:
      # Small pool: the free database allows few connections and the app's queries are short.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 32
        query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    cache-names: airportMaps,destinations,sights,holidays,fx
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=6h
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

gatemate:
  public-url: ${PUBLIC_URL:https://gatemate.app}
  cors-origins: ${CORS_ORIGINS:capacitor://localhost,https://localhost,http://localhost,http://localhost:4200,http://localhost:8100}
  jwt:
    issuer: ${JWT_ISSUER:https://api.gatemate.app}
    access-ttl: PT15M
    refresh-ttl: P60D
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
  apple:
    audiences: ${APPLE_AUDIENCES:app.gatemate.ios,app.gatemate.web}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    client-id: ${APPLE_CLIENT_ID:app.gatemate.ios}
    private-key-pem: ${APPLE_PRIVATE_KEY:}
  google:
    audiences: ${GOOGLE_AUDIENCES:}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    max-login-attempts: 5
    lockout: PT15M
  booking:
    sandbox: false
    inbound-secret: ${INBOUND_EMAIL_SECRET:}
    airline-email-domains: ${AIRLINE_EMAIL_DOMAINS:wizzair.com,ryanair.com,lufthansa.com,tarom.ro,easyjet.com,britishairways.com,klm.com,airfrance.fr,emirates.com,qatarairways.com,turkishairlines.com}
    import-domain: ${IMPORT_EMAIL_DOMAIN:}
    import-address: ${IMPORT_EMAIL_ADDRESS:}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Gatemate}
    provider: ${MAIL_PROVIDER:brevo}
    api-key: ${MAIL_API_KEY:}
    reset-url: ${RESET_URL:https://gatemate.app/reset}
  billing:
    webhook-secret: ${REVENUECAT_WEBHOOK_SECRET:}
    secret-api-key: ${REVENUECAT_SECRET_KEY:}
    entitlement: pro
    free-upcoming-trips: 3
  assistant:
    # Velo, the AI travel agent. Empty key = Velo is off. Set ANTHROPIC_API_KEY in the Render dashboard, never in git.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ASSISTANT_MODEL:claude-opus-5-5}
    effort: ${ASSISTANT_EFFORT:low}
    # Alternative with a free tier: with GEMINI_API_KEY set (and no Anthropic key), Velo runs on Google Gemini.
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-flash-lite-latest}
  integrations:
    unsplash-access-key: ${UNSPLASH_ACCESS_KEY:}
    aero-data-box-key: ${AERODATABOX_KEY:}
    public-data-enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:gatemate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
gatemate:
  cors-origins: http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*,capacitor://localhost,https://localhost
  booking:
    sandbox: true
