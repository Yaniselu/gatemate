databases:
  - name: gatemate-db
    plan: free
    region: frankfurt
    databaseName: gatemate
    user: gatemate

services:
  - type: web
    name: gatemate-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: gatemate-db, property: connectionString }
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: https://gatemate-api-2n16.onrender.com
      - key: REVENUECAT_WEBHOOK_SECRET
        generateValue: true
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
      - key: IMPORT_EMAIL_ADDRESS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost
