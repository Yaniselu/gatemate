# Render Blueprint: Gatemate API + PostgreSQL. Secrets are set in the Render dashboard, never here.
databases:
  - name: gatemate-db
    plan: free
    region: frankfurt
    databaseName: gatemate
    user: gatemate

services:
  - type: web
    name: gatemate-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: gatemate-db, property: connectionString }
      # 256-bit random value generated by Render (AES key for third-party tokens at rest).
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # JWT_PRIVATE_KEY / JWT_PUBLIC_KEY (RSA PEM) are added after creation so sessions survive restarts.
      - key: JWT_ISSUER
        value: https://gatemate-api-2n16.onrender.com
      # Gatemate Pro: shared secret for the RevenueCat webhook (generated; paste it into RevenueCat).
      - key: REVENUECAT_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost
