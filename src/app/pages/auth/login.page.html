<ion-content class="auth">
  <div class="wrap">
    <div class="hero" aria-hidden="true">
      <div class="orbit"></div>
      <div class="badge"><ion-icon name="airplane" /></div>
    </div>

    <div class="stagger">
      <h1 style="--i: 0">Welcome aboard</h1>
      <p class="lead" style="--i: 1">Sign in to see your flights, alerts and trip chats.</p>

      <gm-social-buttons style="--i: 2; display: block" />

      <div class="divider" style="--i: 3">or with email</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate style="--i: 4">
        @if (error()) {
          <div class="form-error" role="alert"><ion-icon name="alert-circle" /> {{ error() }}</div>
        }

        <div class="gm-field" [class.invalid]="invalid('email')">
          <label for="email">Email</label>
          <div class="gm-input-wrap">
            <ion-icon name="mail-outline" />
            <input id="email" type="email" formControlName="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" />
          </div>
          @if (invalid('email')) {
            <span class="gm-error">Enter a valid email address.</span>
          }
        </div>

        <div class="gm-field" [class.invalid]="invalid('password')">
          <label for="password">Password</label>
          <div class="gm-input-wrap">
            <ion-icon name="lock-closed-outline" />
            <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Your password" />
            <button type="button" class="gm-input-action" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              <ion-icon [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'" />
            </button>
          </div>
          @if (invalid('password')) {
            <span class="gm-error">Enter your password.</span>
          }
        </div>

        <div class="row-end"><a routerLink="/auth/forgot">Forgot password?</a></div>

        <button class="gm-btn" type="submit" [disabled]="loading()">
          @if (loading()) { <span class="spinner"></span> } @else { Sign in <ion-icon name="arrow-forward" /> }
        </button>
      </form>
    </div>

    <p class="switch">New to Gatemate? <a routerLink="/auth/register">Create an account</a></p>
  </div>
</ion-content>
