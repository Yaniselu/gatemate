<ion-content [fullscreen]="true" [scrollY]="false" class="welcome" [class.taking-off]="takingOff()">
  <div class="sky">
    <div class="sun"></div>

    <!-- Parallax cloud layers (each strip is 200% wide and loops) -->
    @for (layer of [1, 2, 3]; track layer) {
      <div class="clouds" [class]="'clouds l' + layer">
        @for (strip of [0, 1]; track strip) {
          <svg viewBox="0 0 800 200" preserveAspectRatio="none" aria-hidden="true">
            <g fill="#fff">
              <g transform="translate(40 60)"><circle cx="30" cy="40" r="18" /><circle cx="55" cy="28" r="26" /><circle cx="86" cy="40" r="18" /><rect x="30" y="40" width="56" height="18" /></g>
              <g transform="translate(300 110) scale(.7)"><circle cx="30" cy="40" r="18" /><circle cx="55" cy="28" r="26" /><circle cx="86" cy="40" r="18" /><rect x="30" y="40" width="56" height="18" /></g>
              <g transform="translate(520 30) scale(1.2)"><circle cx="30" cy="40" r="18" /><circle cx="55" cy="28" r="26" /><circle cx="86" cy="40" r="18" /><rect x="30" y="40" width="56" height="18" /></g>
              <g transform="translate(690 120) scale(.6)"><circle cx="30" cy="40" r="18" /><circle cx="55" cy="28" r="26" /><circle cx="86" cy="40" r="18" /><rect x="30" y="40" width="56" height="18" /></g>
            </g>
          </svg>
        }
      </div>
    }

    <div class="speed-lines" aria-hidden="true">
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <span [style.--i]="i"></span>
      }
    </div>

    <div class="plane-stage">
      <div class="plane" #plane>
        <div class="trail t1"></div>
        <div class="trail t2"></div>
        <gm-plane class="bob" />
      </div>
    </div>

    <div class="runway" aria-hidden="true"><span></span></div>
  </div>

  <div class="content">
    <div class="brand">
      <h1 aria-label="Gatemate">
        @for (ch of title; track $index) {
          <span [style.--i]="$index">{{ ch }}</span>
        }
      </h1>
      <p class="powered">powered by <b>Velosyntech</b></p>
    </div>
    <gm-swipe-button class="swipe" label="Get started" (completed)="takeOff()" />
  </div>

  <div class="reveal" #reveal aria-hidden="true"></div>
</ion-content>
